name: staffpulse
description: StaffPulse - Anonymous Employee Wellbeing & Burnout Prevention App for RevenueCat Ship-a-ton 2026
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # UI & Design
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

  # RevenueCat Monetization (REQUIRED for Ship-a-ton)
  purchases_flutter: ^8.0.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Firebase / Backend
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.2
  cloud_firestore: ^4.16.1
  firebase_analytics: ^10.10.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  collection: ^1.18.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # PDF Export (Pro Feature)
  pdf: ^3.10.8
  printing: ^5.12.0

  # Connectivity
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
